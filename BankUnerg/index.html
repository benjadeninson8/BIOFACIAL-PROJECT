<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bank UNERG — Registro KYC</title>
    <meta name="description" content="Sistema de registro biométrico KYC del Banco UNERG" />

    <!-- Preload face-api.js model files so the browser fetches them in parallel
         with JS parsing, not sequentially after React mounts. -->
    <!-- tiny_face_detector: 193 KB — the smallest, loads first -->
    <link rel="preload" as="fetch" crossorigin href="/models/tiny_face_detector_model-weights_manifest.json" />
    <link rel="preload" as="fetch" crossorigin href="/models/tiny_face_detector_model-shard1" />
    <!-- face_landmark_68: 357 KB -->
    <link rel="preload" as="fetch" crossorigin href="/models/face_landmark_68_model-weights_manifest.json" />
    <link rel="preload" as="fetch" crossorigin href="/models/face_landmark_68_model-shard1" />
    <!-- face_recognition: 6.4 MB — start this download ASAP -->
    <link rel="preload" as="fetch" crossorigin href="/models/face_recognition_model-weights_manifest.json" />
    <link rel="preload" as="fetch" crossorigin href="/models/face_recognition_model-shard1" />
    <link rel="preload" as="fetch" crossorigin href="/models/face_recognition_model-shard2" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Service Worker registration: caches model files after first visit,
         making ALL subsequent loads instant (zero network) -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {})
        })
      }
    </script>
    <!-- Blindaje Frontend (Pragma Studio) -->
    <script>
      document.addEventListener('contextmenu', e => e.preventDefault());
      document.addEventListener('keydown', e => {
        if (
          e.key === 'F12' ||
          (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) ||
          (e.ctrlKey && e.key === 'U')
        ) {
          e.preventDefault();
        }
      });
    </script>
  </body>
</html>
